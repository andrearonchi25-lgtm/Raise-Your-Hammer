function addParticipant(){let n=document.getElementById('pname').value.trim(),c=+document.getElementById('pcred').value||500;if(!n)return alert('Inserisci il nome del partecipante.');S.participants.push({name:n,credits:c,players:[]});save();render('auction')}

function brain(){let q=window.brainQ||'';let res=find(q);let targets=S.targets;return `<section class="hero"><div class="eyebrow">🧠 HAMMER BRAIN</div><h1>Chi devo chiamare?</h1><p class="muted">Cerca un giocatore: Hammer ordina i profili per score e valore stimato del database integrato.</p><input id="brainSearch" class="input" value="${esc(q)}" placeholder="Lautaro, Dimarco, Pulisic..." oninput="window.brainQ=this.value;render('brain')"><div class="sectionTitle">I tuoi target</div><div class="players">${targets.map(p=>playerCard(p,true)).join('')||'<div class="notice">Aggiungi qui i giocatori che vuoi nella tua rosa ideale.</div>'}</div></section><div class="sectionTitle">Risultati</div><div class="players">${res.map(p=>playerCard(p,false)).join('')||'<div class="notice">Scrivi il nome di un giocatore.</div>'}</div>`}

function addTarget(name){let p=DB.find(x=>x[1]===name);if(p&&!S.targets.some(x=>x[1]===name))S.targets.push(p);save();render('brain')}function removeTarget(name){S.targets=S.targets.filter(x=>x[1]!==name);save();render('brain')}
function formation(){let pool=S.targets.length?S.targets:S.myTeam.map(x=>DB.find(p=>p[1].toLowerCase()===x.player.toLowerCase())).filter(Boolean);let by=r=>pool.filter(p=>p[0]===r).sort((a,b)=>score(b)-score(a));let ps=by('P').slice(0,1),ds=by('D').slice(0,3),cs=by('C').slice(0,4),as=by('A').slice(0,3);let all=[...ps,...ds,...cs,...as];let teamScore=all.length?Math.round(all.reduce((a,p)=>a+score(p),0)/all.length):0;let teamMap={};all.forEach(p=>teamMap[p[2]]=(teamMap[p[2]]||0)+score(p));let bestTeam=Object.entries(teamMap).sort((a,b)=>b[1]-a[1])[0];return `<section class="hero"><div class="eyebrow">🏟 FORMAZIONE CONSIGLIATA</div><h1>Il miglior XI disponibile</h1><p class="muted">Analisi basata sui profili dei giocatori e sulla forza relativa delle squadre presenti nel database.</p><div class="grid3"><div class="stat"><b>${teamScore||'—'}</b><small>SCORE XI</small></div><div class="stat"><b>3-4-3</b><small>MODULO</small></div><div class="stat"><b>${bestTeam?esc(bestTeam[0]):'—'}</b><small>TEAM TOP</small></div></div></section><div class="sectionTitle">XI consigliato</div><div class="formation"><div class="line">${slots(ps)}</div><div class="line">${slots(ds)}</div><div class="line">${slots(cs)}</div><div class="line">${slots(as)}</div></div><div class="sectionTitle">Perché questi giocatori</div><div class="notice">Hammer privilegia score, valore stimato e copertura dei quattro reparti. Se la tua rosa è incompleta, indica i ruoli mancanti invece di inventare giocatori.</div>`}

<script id="ryh52brainjs">
(function(){
  const esc = x => String(x ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const read = (keys, fallback) => {
    for (const k of keys) {
      try { const v = JSON.parse(localStorage.getItem(k)); if (v != null) return v; } catch(e) {}
    }
    return fallback;
  };
  const getPlayers = () => {
    const p = read(['ryh_players','players','fantacalcio_players'], []);
    if (Array.isArray(p) && p.length) return p;
    return [
      {name:'Giocatore Top',role:'ATT',team:'Serie A',score:90,target:70,max:82,priority:'A'},
      {name:'Centrocampista Value',role:'C',team:'Serie A',score:86,target:35,max:45,priority:'A'},
      {name:'Difensore Premium',role:'D',team:'Serie A',score:84,target:22,max:30,priority:'B'},
      {name:'Portiere Affidabile',role:'P',team:'Serie A',score:81,target:15,max:22,priority:'B'}
    ];
  };
  const getParticipants = () => {
    const p = read(['ryh_participants','participants','fantacalcio_participants'], []);
    return Array.isArray(p) ? p : [];
  };
  const getPurchases = () => {
    const p = read(['ryh_auction_purchases','auction_purchases','ryh_purchases'], []);
    return Array.isArray(p) ? p : [];
  };
  const state = () => {
    const p=getPlayers(), o=getParticipants(), a=getPurchases();
    const avg=p.reduce((n,x)=>n+(Number(x.score)||70),0)/Math.max(1,p.length);
    const pressure=Math.min(95,Math.round(35+o.length*3+a.length*1.5));
    return {
      win:Math.max(25,Math.min(91,Math.round(avg*.62+(100-pressure)*.22))),
      pressure,
      confidence:Math.min(95,45+a.length*2)
    };
  };

  let active='live';

  function mount(){
    let screen=document.querySelector('[data-screen="brain"], #brainScreen, #brain, #hammerBrain');
    if(!screen){
      // Find the existing navigation target by visible text and create the panel
      // only if the app has no dedicated Brain container.
      const candidates=[...document.querySelectorAll('section,main,div')];
      screen=candidates.find(e=>/hammer brain|brain/i.test((e.textContent||'').trim()) && e.children.length<8);
    }
    if(!screen) return;
    screen.id='ryh53BrainScreen';
    screen.classList.add('ryh53-brain-screen');
    render(screen);
  }

  function render(screen){
    const b=state(), p=getPlayers().slice().sort((a,z)=>(Number(z.score)||0)-(Number(a.score)||0)).slice(0,8);
    const o=getParticipants();
    let body='';
    if(active==='live'){
      body=`<div class="ryh53-hero"><div><small>WIN PROBABILITY</small><strong>${b.win}%</strong><p>${b.win>=70?'Situazione favorevole: aspetta i momenti giusti e colpisci i target.':b.win>=50?'Asta equilibrata: proteggi il budget e osserva gli avversari.':'Mercato ostile: evita guerre di rilanci.'}</p><div class="ryh53-bar"><i style="width:${b.win}%"></i></div></div><div class="ryh53-metrics"><span>Pressione <b>${b.pressure}/100</b></span><span>Confidenza <b>${b.confidence}%</b></span></div></div>`;
    } else if(active==='targets'){
      body=`<div class="ryh53-note"><b>🎯 Giocatori perfetti da chiamare</b><small>Score, target e prezzo massimo vengono usati per ordinare le priorità.</small></div><div class="ryh53-list">${
        p.map((x,i)=>`<div class="ryh53-row"><div><b>${esc(x.name||'Giocatore')}</b><small>${esc(x.team||'Serie A')} · ${esc(x.role||'')} · Score ${Number(x.score)||70} · Target ${x.target??'—'} · Max ${x.max??'—'}</small></div><em>${i<2?'🎯 PRIORITÀ':'VALUE'}</em></div>`).join('')
      }</div>`;
    } else if(active==='opponents'){
      body=o.length
        ? `<div class="ryh53-note"><b>👥 Studio avversari</b><small>La lettura migliora man mano che registri gli acquisti durante l'asta.</small></div><div class="ryh53-list">${
          o.map((x,i)=>`<div class="ryh53-row"><div><b>${esc(x.name||x.team||('Avversario '+(i+1)))}</b><small>Crediti: ${x.credits??x.budget??'—'} · Acquisti: ${x.purchases??0}</small></div><em>${i===0?'🔥 MINACCIA':'MONITOR'}</em></div>`).join('')
        }</div>`
        : `<div class="ryh53-empty">👥 Nessun partecipante configurato.<small>Configura l'asta per attivare l'analisi degli avversari.</small></div>`;
    } else {
      body=`<div class="ryh53-note"><b>🏟️ Rosa consigliata</b><small>Il Brain seleziona i profili con score più alto tra i giocatori disponibili.</small></div><div class="ryh53-formation"><b>3-4-3</b><span>Modulo consigliato</span></div><div class="ryh53-list">${
        p.slice(0,11).map((x,i)=>`<div class="ryh53-row"><div><b>${i+1}. ${esc(x.name||'Giocatore')}</b><small>${esc(x.role||'')} · ${esc(x.team||'')}</small></div><em>${Number(x.score)||70}</em></div>`).join('')
      }</div>`;
    }

    screen.innerHTML=`<div class="ryh53-brain">
      <div class="ryh53-head"><div><h2>🧠 Hammer Brain</h2><small>Strategia asta · giocatori · avversari · rosa</small></div></div>
      <div class="ryh53-tabs">
        <button data-tab="live" class="${active==='live'?'on':''}">🧠 LIVE</button>
        <button data-tab="targets" class="${active==='targets'?'on':''}">🎯 TARGET</button>
        <button data-tab="opponents" class="${active==='opponents'?'on':''}">👥 AVVERSARI</button>
        <button data-tab="formation" class="${active==='formation'?'on':''}">🏟️ ROSA</button>
      </div>${body}
      <button class="ryh53-refresh" type="button">↻ AGGIORNA ANALISI</button>
    </div>`;
    screen.querySelectorAll('[data-tab]').forEach(btn=>btn.addEventListener('click',()=>{active=btn.dataset.tab;render(screen)}));
    screen.querySelector('.ryh53-refresh').addEventListener('click',()=>render(screen));
  }

  function boot(){
    if(window.__RYH53_BRAIN_READY) return;
    window.__RYH53_BRAIN_READY=true;
    setTimeout(mount,200);
    setTimeout(mount,1000);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>

function formation(h){
 const ps=getPlayers().slice().sort((a,b)=>(Number(b.score)||0)-(Number(a.score)||0));
 let mod=localStorage.getItem('ryh55_module')||'3-4-3';
 const mods=['3-4-3','3-5-2','4-3-3','4-4-2','4-5-1','5-3-2','5-4-1'];
 const num={ '3-4-3':[3,4,3], '3-5-2':[3,5,2], '4-3-3':[4,3,3], '4-4-2':[4,4,2], '4-5-1':[4,5,1], '5-3-2':[5,3,2], '5-4-1':[5,4,1] };

 const role=x=>String(x.role||'').toUpperCase();
 const bucket=r=>ps.filter(p=>role(p)===r);
 const defenders=ps.filter(p=>['D','DC','DEF','B'].includes(role(p)));
 const mids=ps.filter(p=>['C','M','CC','TRQ'].includes(role(p)));
 const attackers=ps.filter(p=>['A','ATT','PC','W'].includes(role(p)));
 const keepers=ps.filter(p=>['P','POR','GK'].includes(role(p)));
 const fallback=(arr,n)=>arr.slice(0,n);

 function build(){
   const [nd,nm,na]=num[mod];
   const gk=fallback(keepers,1);
   const ds=fallback(defenders,nd);
   const ms=fallback(mids,nm);
   const as=fallback(attackers,na);
   // If the imported database uses unknown role labels, fill remaining slots
   // by score while keeping the selected module as the primary constraint.
   let used=new Set([...gk,...ds,...ms,...as]);
   const chosen=[...gk,...ds,...ms,...as];
   const need=11-chosen.length;
   if(need>0) chosen.push(...ps.filter(p=>!used.has(p)).slice(0,need));
   return {gk,ds,ms,as,chosen:chosen.slice(0,11)};
 }

 function modifier(xi){
   const d=xi.ds;
   if(d.length<3 || !xi.gk.length) return {points:0,label:'Modificatore non attivo'};
   const vals=[Number(xi.gk[0].score)||70,...d.map(p=>Number(p.score)||70)].sort((a,b)=>b-a);
   const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
   // Generic Fantacalcio-style defense modifier: reward a stronger defensive unit.
   // The thresholds are intentionally kept configurable in the UI.
   let pts=0;
   if(avg>=88) pts=4;
   else if(avg>=84) pts=3;
   else if(avg>=80) pts=2;
   else if(avg>=76) pts=1;
   return {points:pts,label:`+${pts} potenziale modificatore · media difesa ${avg.toFixed(1)}`};
 }

 function attackScore(xi){
   const vals=xi.as.map(p=>Number(p.score)||70);
   return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
 }

 function total(xi){
   const base=xi.chosen.reduce((a,p)=>a+(Number(p.score)||70),0);
   const m=modifier(xi).points;
   return base+m*8; // strategic weighting: a strong modifier matters, but does not dominate the XI
 }

 const xi=build();
 const m=modifier(xi);
 const base=xi.chosen.reduce((a,p)=>a+(Number(p.score)||70),0);
 const totalScore=total(xi);
 const attack=attackScore(xi);

 const card=(p)=>`<div class="ryh55-player"><b>${esc(p.name||'Giocatore')}</b><small>${esc(p.team||'')} · ${Number(p.score)||70}</small></div>`;
 const line=(arr)=>`<div class="ryh55-line">${arr.map(card).join('')||'<div class="ryh55-player"><small>Ruolo non disponibile</small></div>'}</div>`;

 h.innerHTML=`<div class="ryh54-panel">
   <h2>🏟️ Formazione consigliata</h2>
   <small>Il Brain cerca il miglior XI disponibile, confronta i moduli e valorizza il modificatore.</small>

   <div class="ryh55-box">
     <h3>MODULO</h3>
     <small>Scegli il modulo: il Brain ricalcola immediatamente l'XI.</small>
     <div class="ryh55-mods">${mods.map(x=>`<button class="ryh55-mod ${x===mod?'on':''}" data-mod="${x}">${x}</button>`).join('')}</div>
   </div>

   <div class="ryh55-score">
     <div><span>PUNTEGGIO STRATEGICO</span><strong>${totalScore.toFixed(0)}</strong></div>
     <div><span>ATTACCO</span><b>${attack.toFixed(1)}</b></div>
   </div>

   <div class="ryh55-box">
     <h3>🛡️ MODIFICATORE DIFESA</h3>
     <small>${m.label}. Il sistema premia una difesa forte senza sacrificare automaticamente l'attacco.</small>
   </div>

   <div class="ryh55-box">
     <h3>XI CONSIGLIATO · ${mod}</h3>
     <div class="ryh55-xi">
       ${line(xi.gk)}
       ${line(xi.ds)}
       ${line(xi.ms)}
       ${line(xi.as)}
     </div>
   </div>

   <div class="ryh55-box">
     <h3>🧠 PERCHÉ QUESTA FORMAZIONE</h3>
     <div class="ryh55-reasons">
       • massimizza gli score disponibili per ruolo<br>
       • considera il potenziale del modificatore difensivo<br>
       • confronta il modulo scelto con la composizione reale della rosa<br>
       • puoi cambiare modulo in qualsiasi momento e vedere subito il nuovo XI
     </div>
   </div>
 </div>`;

 h.querySelectorAll('[data-mod]').forEach(btn=>btn.onclick=()=>{
   localStorage.setItem('ryh55_module',btn.dataset.mod);
   formation(h);
 });
}

<script id="ryh56-auction-brain">
(function(){
  const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const read=(keys,fb)=>{for(const k of keys){try{const x=JSON.parse(localStorage.getItem(k));if(x!=null)return x}catch(e){}}return fb};
  const write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
  const players=()=>read(['ryh_players','players'],[]);
  const participants=()=>read(['ryh_participants','participants'],[]);
  const purchases=()=>read(['ryh_auction_purchases','auction_purchases'],[]);
  const brainState=()=>read(['ryh56_brain_state'],{});
  const saveState=v=>write('ryh56_brain_state',v);

  function currentPlayer(){
    const s=brainState();
    return s.currentPlayer || null;
  }
  function playerInfo(name){
    const p=players().find(x=>String(x.name||'').toLowerCase()===String(name||'').toLowerCase());
    return p || {name,score:75,target:0,max:0,role:'',team:''};
  }

  function analyze(){
    const s=brainState(), p=currentPlayer(), info=p?playerInfo(p.name):null;
    const opp=participants(), buys=purchases();
    if(!info)return {action:'ATTENDI',max:0,next:0,reason:'Seleziona un giocatore per attivare il Brain d’asta.',pressure:0};
    const score=Number(info.score)||75;
    const target=Number(info.target)||0;
    const declaredMax=Number(info.max)||0;
    const hist=buys.filter(x=>String(x.player||x.name||'').toLowerCase()===String(info.name||'').toLowerCase());
    const last=Math.max(0,...hist.map(x=>Number(x.price)||0));
    const avgOpp=opp.length?opp.reduce((a,x)=>a+(Number(x.credits??x.budget)||500),0)/opp.length:500;
    const aggressive=opp.length?Math.min(95,Math.round(45 + opp.reduce((a,x)=>a+(Number(x.purchases)||0),0)*2 + (500-avgOpp)/8)):35;
    const ceiling=declaredMax||Math.max(target+5,Math.round(score*.9));
    const suggested=Math.max(last+1,target||last+1);
    const can=suggested<=ceiling;
    return {
      action: can ? (last>=ceiling*.85?'STOP':'RIALZA') : 'PASSA',
      max:ceiling,
      next:suggested,
      reason: can
        ? (last>=ceiling*.85?'Sei vicino al tuo limite: un altro rilancio solo se il giocatore è una priorità assoluta.':'Rilancio consigliato: il prezzo è ancora dentro il valore strategico.')
        : 'Il prezzo ha superato il limite strategico: non inseguire.',
      pressure:aggressive,
      last
    };
  }

  window.ryh56SetAuctionPlayer=function(name){
    const s=brainState();s.currentPlayer={name};saveState(s);renderAuctionBrain();
  };
  window.ryh56Raise=function(){
    const a=analyze();
    if(a.action==='PASSA'||a.action==='STOP')return;
    const p=currentPlayer();
    const arr=purchases();arr.push({player:p.name,price:a.next,brain:true,time:Date.now()});write('ryh_auction_purchases',arr);
    renderAuctionBrain();
  };
  window.ryh56Pass=function(){const s=brainState();s.lastDecision='PASSA';saveState(s);renderAuctionBrain()};

  function renderAuctionBrain(){
    const host=document.getElementById('ryh56AuctionBrain'); if(!host)return;
    const p=currentPlayer(), a=analyze(), opp=participants();
    if(!p){
      host.innerHTML=`<div class="ryh56-advice"><h3>🧠 BRAIN ASTA LIVE</h3><strong>ATTENDI</strong><p>Inserisci/seleziona il giocatore chiamato per ricevere il consiglio di rilancio.</p></div>`;
      return;
    }
    host.innerHTML=`<div class="ryh56-advice">
      <h3>🧠 BRAIN ASTA LIVE · ${esc(p.name)}</h3>
      <strong>${a.action==='RIALZA'?'🔨 RIALZA':a.action==='STOP'?'🛑 FERMATI':'✋ PASSA'}</strong>
      <p>${esc(a.reason)}</p>
      <div class="ryh56-price"><div><span>PROSSIMO RILANCIO</span><b>${a.next} cr</b></div><div><span>LIMITE ASSOLUTO</span><b>${a.max} cr</b></div><div><span>PRESSIONE MERCATO</span><b>${a.pressure}/100</b></div></div>
      <div class="ryh56-actions"><button class="raise" onclick="ryh56Raise()">🔨 RIALZA A ${a.next}</button><button class="pass" onclick="ryh56Pass()">✋ PASSA</button></div>
      <div class="ryh56-opps">${opp.slice(0,8).map((o,i)=>`<div class="ryh56-opp"><div><b>${esc(o.name||o.team||'Avversario '+(i+1))}</b><small>Crediti ${o.credits??o.budget??'—'} · Acquisti ${o.purchases??0}</small></div><em>${i===0?'AGGRESSIVO':'OSSERVA'}</em></div>`).join('')||'<div class="ryh56-opp"><small>Nessun avversario configurato</small></div>'}</div>
      <div class="ryh56-log">Il limite viene calcolato usando valore del giocatore, target, max personale e pressione dell’asta. Il Brain non supera mai il tuo tetto senza una modifica esplicita.</div>
    </div>`;
  }

  function inject(){
    if(document.getElementById('ryh56AuctionBrain'))return;
    const h=document.createElement('div');h.id='ryh56AuctionBrain';
    const hosts=[...document.querySelectorAll('.ryh54-panel,.ryh54-screen,main,section')];
    const auction=hosts.find(x=>/asta/i.test(x.textContent||'') && !/brain/i.test(x.textContent||''));
    (auction||document.body).appendChild(h);
    renderAuctionBrain();
  }

  // Connect the existing auction registration fields to the Brain.
  function hook(){
    inject();
    const buy=document.querySelector('#buyname');
    if(buy && !buy.dataset.ryh56){
      buy.dataset.ryh56='1';
      buy.addEventListener('input',()=>{
        const s=brainState();s.currentPlayer={name:buy.value.trim()};saveState(s);renderAuctionBrain();
      });
    }
  }
  document.addEventListener('DOMContentLoaded',()=>setTimeout(hook,500));
  setInterval(hook,1500);
})();
</script>

function $(id,r=document){return r.querySelector('#'+id)}

window.ryh59ImportListone=function(file){
 if(!file)return;

 reader.onload=function(){
  try{
   let text=String(reader.result||'').trim(), rows=[];
   if(file.name.toLowerCase().endsWith('.json')){
    const data=JSON.parse(text); rows=Array.isArray(data)?data:(data.players||data.calciatori||[]);
   }else{
    const lines=text.split(/\r?\n/).filter(Boolean), sep=lines[0].includes(';')?';':',';
    const head=lines.shift().split(sep).map(x=>x.trim().toLowerCase());
    rows=lines.map(line=>{
      const c=line.split(sep); let o={};
      head.forEach((h,i)=>o[h]=c[i]?.trim()||'');
      return {name:o.name||o.nome||o.calciatore,team:o.team||o.sq||o.squadra,role:o.role||o.ruolo,

    });

   rows=rows.filter(x=>x.name).map(x=>({...x,name:String(x.name).trim()}));
   localStorage.setItem('ryh_players',JSON.stringify(rows));
   alert('Listone importato: '+rows.length+' giocatori.');
   location.reload();

 };
 reader.readAsText(file);
};

<script id="ryh60-brain-engine">
(function(){
 const read=(k,fb)=>{try{let x=JSON.parse(localStorage.getItem(k));return x??fb}catch(e){return fb}};
 const write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
 const players=()=>read('ryh_players',read('players',[]));
 const parts=()=>read('ryh_participants',read('participants',[]));
 const purchases=()=>read('ryh_auction_purchases',read('auction_purchases',[]));
 const state=()=>read('ryh60_state',{});
 const save=x=>write('ryh60_state',x);
 const n=(x,d=0)=>Number(x)||d;

 window.ryh60AnalyzePlayer=function(p,price=0){
   const fvm=n(p.fvm), score=n(p.score,70), quote=n(p.quote), goals=n(p.goals), ass=n(p.assists);
   const apps=n(p.apps), starts=n(p.starts), form=n(p.form);
   const bonus=goals*3+ass*2;
   const consistency=apps?Math.min(12,apps/2):4;
   const starter=starts?(Math.min(10,starts/10)):5;
   const valueGap=fvm?Math.max(-20,Math.min(20,(fvm/10)-price)):0;
   let auction=Math.round(Math.min(100,Math.max(0,score*.62+bonus+consistency+starter+valueGap)));
   const maxBase=fvm?Math.round(fvm/10):Math.max(quote+5,Math.round(score*.8));
   const max=Math.max(quote||1,Math.round(maxBase*(1+(auction-70)/220)));
   let verdict=price>max?'LASCIA':price>max*.9?'ULTIMO RILANCIO':price>0&&price<=max*.72?'AFFARE':auction>=82?'DA PRENDERE':auction>=74?'RIALZA':'ASPETTA';
   return {auction,max,verdict,score,fvm,quote,bonus,consistency,starter};
 };

 window.ryh60OpponentProfiles=function(){
   return parts().map((o,i)=>{
     const name=o.name||o.team||`Avversario ${i+1}`;
     const budget=n(o.credits??o.budget,500);
     const buys=n(o.purchases,0);
     const spent=n(o.spent,500-budget);
     const avg=buys?spent/buys:0;
     let style=avg>=35?'AGGRESSIVO':avg>=22?'OPPORTUNISTA':'RISPARMIATORE';
     return {name,budget,buys,spent,avg,style};
   });
 };

 window.ryh60RenderLive=function(host,p,price){
   if(!host||!p)return;
   const a=window.ryh60AnalyzePlayer(p,price);
   const opp=window.ryh60OpponentProfiles();
   const pressure=opp.length?Math.round(opp.reduce((x,o)=>x+(o.style==='AGGRESSIVO'?85:o.style==='OPPORTUNISTA'?60:35),0)/opp.length):50;
   let action=a.verdict;
   if(action==='RIALZA') action='🔨 RIALZA';
   else if(action==='AFFARE') action='💰 AFFARE';
   else if(action==='DA PRENDERE') action='🟢 DA PRENDERE';
   else if(action==='ULTIMO RILANCIO') action='⚠️ ULTIMO RILANCIO';
   else if(action==='LASCIA') action='🛑 LASCIA';
   else action='👀 ASPETTA';
   host.innerHTML=`<div class="ryh60-live">
     <h3>🧠 BRAIN PRO · ${p.name||'Giocatore'}</h3><div class="ryh60-action">${action}</div>
     <div class="ryh60-sub">Il punteggio combina rendimento, valore di mercato, disponibilità e prezzo d'asta. Il limite è dinamico.</div>
     <div class="ryh60-grid">
       <div class="ryh60-box"><span>AUCTION SCORE</span><b>${a.auction}/100</b></div>
       <div class="ryh60-box"><span>PREZZO ATTUALE</span><b>${price||0}</b></div>
       <div class="ryh60-box"><span>MAX BRAIN</span><b>${a.max}</b></div>
       <div class="ryh60-box"><span>FVM</span><b>${a.fvm||'—'}</b></div>
       <div class="ryh60-box"><span>QUOTAZIONE</span><b>${a.quote||'—'}</b></div>
       <div class="ryh60-box"><span>BONUS POT.</span><b>${a.bonus}</b></div>
     </div>
     <div class="ryh60-risk"><span>PRESSIONE AVVERSARI</span><b>${pressure}/100</b></div>
     <div class="ryh60-bar"><i style="width:${pressure}%"></i></div>
     <div class="ryh60-plans">
       <div class="ryh60-plan"><b>Piano A</b> · Se il prezzo resta ≤ ${Math.round(a.max*.72)}: attacca.</div>
       <div class="ryh60-plan"><b>Piano B</b> · Tra ${Math.round(a.max*.72)} e ${Math.round(a.max*.9)}: valuta il rilancio.</div>
       <div class="ryh60-plan"><b>Piano C</b> · Oltre ${a.max}: non inseguire, passa al prossimo obiettivo.</div>
     </div>
     <div class="ryh60-note">👥 Avversari osservati: ${opp.length}. Il Brain costruisce progressivamente il loro profilo in base a crediti, acquisti e spesa media.</div>
   </div>`;
 };
})();
</script>

   if(!host||!p)return;
   const price=Number(document.querySelector('#buyprice,#auctionprice,#price')?.value||0);
   window.ryh60RenderLive(host,p,price);
 }
 setInterval(tick,1000);
 document.addEventListener('DOMContentLoaded',()=>setTimeout(tick,700));
})();
</script>
