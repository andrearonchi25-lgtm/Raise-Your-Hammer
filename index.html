<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070d14"><title>Raise Your Hammer</title><style>
:root{--bg:#070d14;--panel:#0e1823;--panel2:#111e2b;--line:#263a4e;--text:#eef3f7;--muted:#7f8d9f;--gold:#d8b55e;--green:#62d993;--red:#ff8177}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;padding:14px 12px 88px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.brand{display:flex;gap:9px;align-items:center}.mark{width:34px;height:34px;border:1px solid #81662e;border-radius:10px;display:grid;place-items:center;background:#16170f}.brand b{font-size:11px;letter-spacing:.8px}.brand small{display:block;color:var(--muted);font-size:6px;margin-top:2px}.menu{width:36px;height:36px;border:1px solid var(--line);background:var(--panel);border-radius:11px;color:#fff;font-size:17px}.view{display:none}.view.active{display:block}.hero,.card{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:9px}.hero{background:radial-gradient(circle at 100% 0,#2b2517 0,#111b26 40%,#0b141d 100%)}h1{font-size:21px;margin:4px 0}.eyebrow{font-size:7px;letter-spacing:1.2px;color:#b6a16d;font-weight:900}.muted{color:var(--muted);font-size:8px}.btn{border:1px solid var(--line);background:#142131;color:#fff;border-radius:11px;padding:10px 12px;font-weight:900;font-size:8px}.btn.gold{background:linear-gradient(135deg,#e4c36c,#a67f2f);color:#0b1117;border-color:#b18a39}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stat{padding:8px;border:1px solid var(--line);border-radius:11px;background:#0b141e;text-align:center}.stat b{font-size:12px}.stat small{display:block;color:var(--muted);font-size:6px;margin-top:2px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.sectionTitle{font-size:10px;font-weight:900;margin:11px 0 6px}.input,.select{width:100%;padding:10px;border:1px solid var(--line);background:#0a131c;color:#fff;border-radius:10px;font-size:9px;outline:none}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stack{display:grid;gap:7px}.players{display:grid;grid-template-columns:1fr;gap:7px}.p{padding:10px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#122131,#0b151f)}.p .name{font-size:10px;font-weight:900}.p small{font-size:6px;color:var(--muted)}.score{font-size:18px;font-weight:1000;color:var(--gold)}.pill{font-size:6px;font-weight:900;padding:4px 6px;border-radius:7px;background:#173225;color:var(--green)}.pmeta{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:7px}.pmeta div{background:#09121a;border-radius:7px;padding:5px;text-align:center}.pmeta small{display:block;font-size:5px}.pmeta b{font-size:8px}.bottom{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);width:min(94%,500px);padding:5px;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:rgba(8,14,21,.96);border:1px solid #314457;border-radius:17px;backdrop-filter:blur(12px);z-index:20}.bottom button{border:0;background:none;color:#75869a;font-size:6px;font-weight:900;padding:5px}.bottom button b{display:block;font-size:13px;margin-bottom:2px}.bottom button.active{color:var(--gold)}.drawer{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:50;display:none}.drawer.open{display:block}.drawerPanel{position:absolute;right:0;top:0;height:100%;width:min(86%,360px);background:#0b141e;border-left:1px solid var(--line);padding:18px;overflow:auto}.drawerItem{width:100%;padding:13px 10px;margin:4px 0;text-align:left;border:1px solid var(--line);background:var(--panel);color:#fff;border-radius:11px;font-size:9px;font-weight:900}.auctionShell{min-height:calc(100vh - 105px);display:flex;flex-direction:column}.auctionBody{flex:1;overflow:auto;padding-bottom:8px}.stickyActions{position:sticky;bottom:0;padding-top:8px;background:linear-gradient(transparent,var(--bg) 35%);display:flex;gap:7px}.log{max-height:170px;overflow:auto;font-size:7px;color:#aeb9c6}.log div{padding:5px 0;border-bottom:1px solid #182838}.target{border:1px solid #5a4928;background:#1b1710;border-radius:12px;padding:10px}.big{font-size:28px;font-weight:1000;color:var(--gold)}.formation{display:grid;gap:7px}.line{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.slot{min-height:56px;border:1px solid var(--line);border-radius:10px;background:#0d1822;padding:6px;text-align:center;font-size:6px}.slot b{display:block;font-size:8px}.empty{color:#66778b}.notice{padding:9px;border-radius:11px;background:#152335;border:1px solid var(--line);font-size:7px}.danger{background:#321b1a;color:#ffb0a9}.success{background:#123022;color:#8de6ad}@media(min-width:600px){.players{grid-template-columns:1fr 1fr}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="mark">🔨</div><div><b>RAISE YOUR HAMMER</b><small>FANTACALCIO COMMAND CENTER</small></div></div><button class="menu" onclick="openMenu()">☰</button></header><main id="home" class="view active"></main><main id="auction" class="view"></main><main id="brain" class="view"></main><main id="formation" class="view"></main></div><nav class="bottom"><button id="navHome" class="active" onclick="show('home')"><b>⌂</b>HOME</button><button id="navAuction" onclick="show('auction')"><b>🔨</b>ASTA</button><button id="navBrain" onclick="show('brain')"><b>🧠</b>BRAIN</button><button id="navFormation" onclick="show('formation')"><b>🏟</b>CAMPO</button></nav><div id="drawer" class="drawer" onclick="if(event.target===this)closeMenu()"><div class="drawerPanel"><div class="row"><b>MENU</b><button class="btn" onclick="closeMenu()">✕</button></div><button class="drawerItem" onclick="closeMenu();show('home')">⌂ Home</button><button class="drawerItem" onclick="closeMenu();show('auction')">🔨 Asta e partecipanti</button><button class="drawerItem" onclick="closeMenu();show('brain')">🧠 Hammer Brain</button><button class="drawerItem" onclick="closeMenu();show('formation')">🏟 Formazione consigliata</button></div></div><script>const DB=[["A", "Martinez L.", "Inter", 35, 68], ["A", "Malen", "Roma", 34, 66], ["D", "Dimarco", "Inter", 32, 62], ["C", "Paz N.", "Como", 30, 58], ["A", "Thuram", "Inter", 29, 56], ["A", "Hojlund", "Napoli", 28, 54], ["C", "McTominay", "Napoli", 28, 54], ["C", "Calhanoglu", "Inter", 27, 52], ["A", "Ramos G.", "Milan", 27, 52], ["A", "Kolo Muani", "Juventus", 26, 50], ["C", "Orsolini", "Bologna", 26, 50], ["A", "Kean", "Fiorentina", 25, 48], ["C", "Pulisic", "Milan", 25, 48], ["A", "Yildiz", "Juventus", 23, 44], ["C", "Rabiot", "Milan", 22, 42], ["A", "Douvikas", "Como", 20, 38], ["C", "Baturina", "Como", 19, 37], ["A", "Davis K.", "Udinese", 19, 37], ["C", "Mora", "Roma", 19, 37], ["A", "Scamacca", "Atalanta", 19, 37], ["A", "Berardi", "Sassuolo", 18, 35], ["C", "Da Cunha", "Como", 18, 35], ["A", "Krstovic", "Atalanta", 18, 35], ["A", "Leao", "Milan", 18, 35], ["D", "Molina N.", "Roma", 18, 35], ["P", "Svilar", "Roma", 18, 35], ["C", "Zaniolo", "Udinese", 18, 35], ["C", "Atta", "Fiorentina", 17, 33], ["C", "Barella", "Inter", 17, 33], ["A", "De Ketelaere", "Atalanta", 17, 33], ["P", "Martinez Jo.", "Inter", 17, 33], ["C", "McKennie", "Juventus", 17, 33], ["D", "Wesley", "Roma", 17, 33], ["D", "Akanji", "Inter", 16, 31], ["P", "Butez", "Como", 16, 31], ["P", "Carnesecchi", "Atalanta", 16, 31], ["A", "Dovbyk", "Bologna", 16, 31], ["A", "Esposito F.P.", "Inter", 16, 31], ["P", "Vicario", "Juventus", 16, 31], ["C", "Zaccagni", "Lazio", 16, 31], ["D", "Bremer", "Juventus", 15, 29], ["C", "De Bruyne", "Napoli", 15, 29], ["A", "Laurientè", "Sassuolo", 15, 29], ["P", "Maignan", "Milan", 15, 29], ["D", "Mancini", "Roma", 15, 29], ["A", "Pellegrino M.", "Fiorentina", 15, 29], ["A", "Simeone", "Torino", 15, 29], ["D", "Bastoni", "Inter", 14, 27], ["A", "Castro S.", "Roma", 14, 27], ["A", "Dybala", "Roma", 14, 27], ["D", "Pavlovic", "Milan", 14, 27], ["D", "Rrahmani", "Napoli", 14, 27], ["A", "Santos A.", "Napoli", 14, 27], ["C", "Vlasic", "Torino", 14, 27], ["P", "De Gea", "Fiorentina", 13, 25], ["A", "Esposito Se.", "Cagliari", 13, 25], ["C", "Gudmundsson A.", "Fiorentina", 13, 25], ["D", "Kalulu", "Juventus", 13, 25], ["A", "Kevin Carlos", "Cagliari", 13, 25], ["D", "N'Dicka", "Roma", 13, 25], ["A", "Nkunku", "Milan", 13, 25], ["A", "Pinamonti", "Sassuolo", 13, 25], ["A", "Raspadori", "Atalanta", 13, 25], ["D", "Solet", "Udinese", 13, 25], ["C", "Taylor K.", "Lazio", 13, 25], ["A", "Adams A.", "Venezia", 12, 23], ["C", "Alajbegovic", "Juventus", 12, 23], ["C", "Conceicao", "Juventus", 12, 23], ["D", "Di Lorenzo", "Napoli", 12, 23], ["C", "Ederson D.S.", "Atalanta", 12, 23], ["D", "Gila", "Milan", 12, 23], ["C", "Mastantuono", "Fiorentina", 12, 23], ["C", "Modric", "Milan", 12, 23], ["C", "Moreira", "Milan", 12, 23], ["C", "Rodriguez Je.", "Como", 12, 23], ["C", "Samardzic", "Atalanta", 12, 23], ["A", "Soulè", "Roma", 12, 23], ["D", "Spence", "Inter", 12, 23], ["D", "Stones", "Inter", 12, 23], ["C", "Baldanzi", "Genoa", 11, 21], ["D", "Bisseck", "Inter", 11, 21], ["A", "Colombo", "Genoa", 11, 21], ["A", "Diao", "Como", 11, 21], ["P", "Meret", "Napoli", 11, 21], ["D", "Ostigard", "Genoa", 11, 21], ["C", "Rowe", "Bologna", 11, 21], ["A", "Tourè E.", "Parma", 11, 21], ["C", "Zambo Anguissa", "Napoli", 11, 21], ["A", "Bowie", "Sassuolo", 10, 19], ["C", "Casadei", "Torino", 10, 19], ["A", "Dia", "Lazio", 10, 19], ["D", "Dodò", "Fiorentina", 10, 19], ["C", "Ekkelenkamp", "Udinese", 10, 19], ["D", "Hermoso", "Roma", 10, 19], ["C", "Konè M.", "Roma", 10, 19], ["C", "Pellegrini Lo.", "Roma", 10, 19], ["C", "Perrone", "Como", 10, 19], ["C", "Politano", "Napoli", 10, 19], ["D", "Ramon", "Como", 10, 19], ["A", "Ratkov", "Lazio", 10, 19], ["A", "Romero D.", "Parma", 10, 19], ["C", "Saelemaekers", "Milan", 10, 19], ["D", "Scalvini", "Atalanta", 10, 19], ["P", "Skorupski", "Bologna", 10, 19], ["C", "Thorstvedt", "Sassuolo", 10, 19], ["C", "Thuram K.", "Juventus", 10, 19], ["C", "Zielinski", "Inter", 10, 19]];
let S=JSON.parse(localStorage.getItem('RYH51')||'null')||{credits:500,participants:[],myTeam:[],auctionLog:[],targets:[]};function save(){localStorage.setItem('RYH51',JSON.stringify(S))}function esc(x){return String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.bottom button').forEach(x=>x.classList.remove('active'));document.getElementById('nav'+id[0].toUpperCase()+id.slice(1)).classList.add('active');render(id)}function openMenu(){document.getElementById('drawer').classList.add('open')}function closeMenu(){document.getElementById('drawer').classList.remove('open')}
function roleName(r){return r==='P'?'Portiere':r==='D'?'Difensore':r==='C'?'Centrocampista':'Attaccante'}function score(p){return p[4]}function price(p){return p[3]}function find(q){q=q.toLowerCase().trim();return DB.filter(p=>(p[1]+' '+p[2]).toLowerCase().includes(q)).sort((a,b)=>score(b)-score(a)).slice(0,20)}
function home(){let n=S.participants.length;return `<section class="hero"><div class="eyebrow">ASTA 2026/27</div><h1>Pronto a costruire la tua rosa?</h1><p class="muted">Una base pulita: asta, partecipanti, Brain e formazione consigliata.</p><button class="btn gold" onclick="show('auction')">🔨 CONFIGURA ASTA</button><div class="grid3" style="margin-top:8px"><div class="stat"><b>${S.credits}</b><small>CREDITI</small></div><div class="stat"><b>${n}</b><small>PARTECIPANTI</small></div><div class="stat"><b>${S.myTeam.length}</b><small>ACQUISTI</small></div></div></section><div class="sectionTitle">Cosa vuoi fare?</div><div class="stack"><button class="drawerItem" onclick="show('auction')">🔨 Imposta partecipanti e asta</button><button class="drawerItem" onclick="show('brain')">🧠 Studia i giocatori e scegli i target</button><button class="drawerItem" onclick="show('formation')">🏟 Costruisci la formazione consigliata</button></div>`}
function auction(){let parts=S.participants.map((x,i)=>`<div class="p"><div class="row"><div><b class="name">${esc(x.name)}</b><small>${x.credits} crediti · ${x.players.length} acquisti</small></div><span class="pill">PARTECIPANTE ${i+1}</span></div></div>`).join('');return `<div class="auctionShell"><div class="auctionBody"><section class="hero"><div class="eyebrow">🔨 ASTA</div><h1>Configurazione</h1><p class="muted">Imposta i partecipanti e poi registra ogni acquisto.</p><div class="formgrid"><input id="pname" class="input" placeholder="Nome partecipante"><input id="pcred" class="input" type="number" value="500" placeholder="Crediti"></div><button class="btn gold" style="margin-top:7px" onclick="addParticipant()">+ Aggiungi partecipante</button></section><div class="sectionTitle">Partecipanti (${S.participants.length})</div>${parts||'<div class="notice">Nessun partecipante ancora. Aggiungili qui.</div>'}<div class="sectionTitle">Registra acquisto</div><section class="card"><div class="formgrid"><input id="buyPlayer" class="input" placeholder="Giocatore"><input id="buyPrice" class="input" type="number" placeholder="Prezzo"></div><select id="buyBuyer" class="select" style="margin-top:7px">${S.participants.map((x,i)=>`<option value="${i}">${esc(x.name)}</option>`).join('')}</select><button class="btn gold" style="margin-top:7px" onclick="registerBuy()">Registra acquisto</button></section><section class="card"><div class="row"><b>Ultimi acquisti</b><span class="muted">${S.auctionLog.length}</span></div><div class="log">${S.auctionLog.slice().reverse().slice(0,20).map(x=>`<div>${esc(x.player)} — <b>${x.price}</b> cr · ${esc(x.buyer)}</div>`).join('')||'<div>Nessun acquisto registrato.</div>'}</div></section></div></div>`}
function addParticipant(){let n=document.getElementById('pname').value.trim(),c=+document.getElementById('pcred').value||500;if(!n)return alert('Inserisci il nome del partecipante.');S.participants.push({name:n,credits:c,players:[]});save();render('auction')}
function registerBuy(){let p=document.getElementById('buyPlayer').value.trim(),pr=+document.getElementById('buyPrice').value,b=+document.getElementById('buyBuyer').value;if(!p||!pr||!S.participants[b])return alert('Completa giocatore, prezzo e partecipante.');let t=S.participants[b];if(pr>t.credits)return alert('Crediti insufficienti.');t.credits-=pr;t.players.push({player:p,price:pr});S.auctionLog.push({player:p,price:pr,buyer:t.name});save();render('auction')}
function brain(){let q=window.brainQ||'';let res=find(q);let targets=S.targets;return `<section class="hero"><div class="eyebrow">🧠 HAMMER BRAIN</div><h1>Chi devo chiamare?</h1><p class="muted">Cerca un giocatore: Hammer ordina i profili per score e valore stimato del database integrato.</p><input id="brainSearch" class="input" value="${esc(q)}" placeholder="Lautaro, Dimarco, Pulisic..." oninput="window.brainQ=this.value;render('brain')"><div class="sectionTitle">I tuoi target</div><div class="players">${targets.map(p=>playerCard(p,true)).join('')||'<div class="notice">Aggiungi qui i giocatori che vuoi nella tua rosa ideale.</div>'}</div></section><div class="sectionTitle">Risultati</div><div class="players">${res.map(p=>playerCard(p,false)).join('')||'<div class="notice">Scrivi il nome di un giocatore.</div>'}</div>`}
function playerCard(p,target){let s=score(p), max=Math.max(price(p),Math.round(price(p)*1.25));return `<article class="p"><div class="row"><div><div class="name">${esc(p[1])}</div><small>${roleName(p[0])} · ${esc(p[2])}</small></div><div class="score">${s}</div></div><div class="pmeta"><div><small>VALORE</small><b>${price(p)}</b></div><div><small>MAX</small><b>${max}</b></div><div><small>PRIORITÀ</small><b>${s>=60?'ALTA':s>=40?'MEDIA':'BASSA'}</b></div></div><div style="margin-top:7px"><button class="btn ${target?'':'gold'}" onclick="${target?`removeTarget('${esc(p[1])}')`:`addTarget('${esc(p[1])}')`}">${target?'✓ Nella rosa ideale':'＋ Aggiungi alla rosa ideale'}</button></div></article>`}
function addTarget(name){let p=DB.find(x=>x[1]===name);if(p&&!S.targets.some(x=>x[1]===name))S.targets.push(p);save();render('brain')}function removeTarget(name){S.targets=S.targets.filter(x=>x[1]!==name);save();render('brain')}
function formation(){let pool=S.targets.length?S.targets:S.myTeam.map(x=>DB.find(p=>p[1].toLowerCase()===x.player.toLowerCase())).filter(Boolean);let by=r=>pool.filter(p=>p[0]===r).sort((a,b)=>score(b)-score(a));let ps=by('P').slice(0,1),ds=by('D').slice(0,3),cs=by('C').slice(0,4),as=by('A').slice(0,3);let all=[...ps,...ds,...cs,...as];let teamScore=all.length?Math.round(all.reduce((a,p)=>a+score(p),0)/all.length):0;let teamMap={};all.forEach(p=>teamMap[p[2]]=(teamMap[p[2]]||0)+score(p));let bestTeam=Object.entries(teamMap).sort((a,b)=>b[1]-a[1])[0];return `<section class="hero"><div class="eyebrow">🏟 FORMAZIONE CONSIGLIATA</div><h1>Il miglior XI disponibile</h1><p class="muted">Analisi basata sui profili dei giocatori e sulla forza relativa delle squadre presenti nel database.</p><div class="grid3"><div class="stat"><b>${teamScore||'—'}</b><small>SCORE XI</small></div><div class="stat"><b>3-4-3</b><small>MODULO</small></div><div class="stat"><b>${bestTeam?esc(bestTeam[0]):'—'}</b><small>TEAM TOP</small></div></div></section><div class="sectionTitle">XI consigliato</div><div class="formation"><div class="line">${slots(ps)}</div><div class="line">${slots(ds)}</div><div class="line">${slots(cs)}</div><div class="line">${slots(as)}</div></div><div class="sectionTitle">Perché questi giocatori</div><div class="notice">Hammer privilegia score, valore stimato e copertura dei quattro reparti. Se la tua rosa è incompleta, indica i ruoli mancanti invece di inventare giocatori.</div>`}
function slots(arr){return arr.map(p=>`<div class="slot"><b>${esc(p[1])}</b>${esc(p[2])}<br><span class="pill">${score(p)}</span></div>`).join('')||'<div class="slot empty">—</div>'}
function render(id){document.getElementById(id).innerHTML={home,auction,brain,formation}[id]()}render('home');</script></body></html>
